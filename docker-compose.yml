version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: govrms_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/govrms?replicaSet=rs0
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=production_super_secret_change_me
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - govrms_network

  redis:
    image: redis:7-alpine
    container_name: govrms_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - govrms_network

  mongodb:
    image: mongo:6
    container_name: govrms_mongodb
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    healthcheck:
      test: test $$(echo "rs.initiate({_id:'rs0',members:[{_id:0,host:\"mongodb:27017\"}]}).ok || rs.status().ok" | mongo --port 27017 --quiet) -eq 1
      interval: 10s
      start_period: 30s
    volumes:
      - mongo_data:/data/db
    networks:
      - govrms_network

volumes:
  mongo_data:

networks:
  govrms_network:
    driver: bridge
